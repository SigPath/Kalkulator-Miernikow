<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kalkulator Mierników</title>
<meta name="description" content="Kalkulator mierników: wskazania amperomierza i woltomierza, niepewności pomiarowe, systemy liczbowe, II prawo Kirchhoffa i układy równań.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mierniki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f8;--card:#fff;--fg:#14181f;--mut:#667085;--line:#e3e7ee;--acc:#0b5fff;--out:#eef3ff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e8ebf0;--mut:#98a2b3;--line:#262c36;--acc:#5b94ff;--out:#1d2535}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;
padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:17px;letter-spacing:.04em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:17px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.c{font-size:14px;color:var(--mut);margin:0 0 10px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);font-weight:500;text-align:left;padding:4px 6px 6px}
td{padding:4px 6px}
td:first-child{width:28px;color:var(--mut)}
td.out{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;background:var(--out);border-radius:8px;padding:9px 10px}
th:last-child{text-align:right}
.avg{display:flex;justify-content:space-between;margin-top:10px;padding:12px;border-radius:10px;background:var(--out);font-weight:700}
button{margin-top:10px;font:inherit;font-size:14px;color:var(--acc);background:none;border:0;padding:6px 0}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:4px;padding:4px;margin-bottom:16px;background:var(--line);border-radius:12px}
.tabs button{margin:0;padding:10px 2px;font-weight:600;font-size:12px;line-height:1.15;color:var(--mut);border-radius:9px;overflow-wrap:anywhere}
.tabs button[aria-selected=true]{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card[hidden]{display:none}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--out);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.hint[hidden]{display:none}
.hint .go{background:var(--acc);color:#fff;border-radius:9px;padding:7px 14px;font-weight:600;margin:0}
.hint button{margin:0;color:var(--mut);font-size:16px}
.sub{text-align:right;color:var(--mut);font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
td.rel{font-size:13px;font-weight:500;padding:9px 6px;white-space:nowrap}
.step{margin-top:14px}
.step h3{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.ln{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 8px;border-radius:6px;overflow-wrap:anywhere}
.ln:nth-child(even){background:var(--bg)}
.res{margin-top:8px;padding:12px;border-radius:10px;background:var(--out);font-weight:700;font:700 16px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.err{color:#d92d20;font-size:14px;margin:8px 0}
.all{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:14px ui-monospace,Menlo,monospace}
.all b{color:var(--mut);font-weight:500}
.sw{display:flex;justify-content:flex-end}
.el{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.ehead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;padding-right:32px}
.ehead select{flex:1 1 0;min-width:0;width:auto;font-size:12.5px;padding:6px 4px}
.ehead select[data-f=sign]{flex:0 0 42px}
.ehead .del{position:absolute;top:9px;right:8px;margin:0;padding:3px 5px;font-size:12px;line-height:1;color:var(--mut)}
.ebody{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.ebody[hidden]{display:none}
.kv{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;background:var(--out);border-radius:9px;padding:9px 10px;overflow-wrap:anywhere}
.kbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kbtns button{margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-weight:600}
details.kn{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:14px}
details.kn summary{color:var(--acc);font-weight:600;cursor:pointer}
details.kn p{margin:8px 0 4px;color:var(--mut);font-size:13.5px}
details.kn ul{margin:4px 0;padding-left:18px;color:var(--mut);font-size:13.5px}
details.kn li{margin-bottom:4px}
.warn{color:#b54708;font-size:13.5px;margin:6px 0}
@media(prefers-color-scheme:dark){.warn{color:#fdb022}}
.mx{display:grid;gap:6px;align-items:center;margin-bottom:12px}
.mx input{font-size:15px;padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums}
.mx .ml{font-size:12px;color:var(--mut)}
.mx .me{font-size:15px;color:var(--mut);text-align:center}
.mx .nm{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--acc);font-weight:700;font-size:14px;padding:2px 0}
.mx .rhs{background:var(--out)}
.ln.pre{white-space:pre-wrap}
footer{color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Kalkulator Mierników</h1>
<div class="hint" id="hint" hidden><span>Zainstaluj: dotknij <b>Udostępnij</b> <svg width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M7 1v11M3.5 4.5 7 1l3.5 3.5M2 8H1v9h12V8h-1"/></svg> a potem <b>Do ekranu początkowego</b>.</span><button type="button" id="hintx" aria-label="Zamknij">✕</button></div>
<div class="hint" id="inst" hidden><span>Zainstaluj aplikację na tym urządzeniu.</span><button type="button" id="instgo" class="go">Zainstaluj</button></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="app"></div>
<footer>Mierniki: wartość = (α ÷ α maks.) × zakres · Δ = klasa × zakres ÷ 100 · δ = Δ ÷ wartość<br>II prawo Kirchhoffa: ∑E = ∑I·R<br>Układ równań (Cramer): x = Wx ÷ W</footer>
</main>
<script>
const METERS=[
 {id:"a",title:"AMPEROMIERZ",label:"prąd",units:["A","mA"],range:5,max:30,cls:0.5},
 {id:"v",title:"VOLTOMIERZ",label:"napięcie",units:["V","mV"],range:3,max:50,cls:0.5}
];
const N=11, KEY="kalkulator-miernikow-v1";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state)state={};
METERS.forEach(m=>{state[m.id]=state[m.id]||{range:m.range,max:m.max,unit:m.units[0],alfa:Array(N).fill("")};if(state[m.id].cls===undefined)state[m.id].cls=m.cls});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const num=s=>{const n=parseFloat(String(s).replace(",","."));return isFinite(n)?n:null};
const fmt=n=>n===null?"–":(Math.round(n*1e6)/1e6).toString().replace(".",",");
const fv=n=>fmt(n).replace(/^-/,"−");
const escA=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const valV=s=>typeof s==="number"?fv(s):escA(s);
const app=document.getElementById("app"),tabs=document.getElementById("tabs");
const cards={};
const ALL=[...METERS,{id:"n",title:"SYSTEMY"},{id:"k",title:"II PRAWO KIRCHHOFFA",tab:"II KIRCHHOFFA"},{id:"r",title:"UKŁAD RÓWNAŃ"}];
function show(id){
 state.tab=id;
 ALL.forEach(m=>{cards[m.id].hidden=m.id!==id;tabs.querySelector(`[data-t=${m.id}]`).setAttribute("aria-selected",m.id===id)});
 save();
}
ALL.forEach(m=>{const b=document.createElement("button");b.type="button";b.dataset.t=m.id;b.setAttribute("role","tab");b.textContent=m.tab||m.title;b.onclick=()=>show(m.id);tabs.appendChild(b)});
METERS.forEach(m=>{
 const s=state[m.id], u=()=>s.unit;
 const card=document.createElement("section");card.className="card";
 card.innerHTML=`<h2>${m.title}</h2>
 <div class="row">
  <div><label>Max zakres przyrządu</label><input data-k=range inputmode=decimal value="${valV(s.range)}"></div>
  <div><label>Jednostka</label><select data-k=unit>${m.units.map(x=>`<option${x==s.unit?" selected":""}>${x}</option>`).join("")}</select></div>
  <div><label>Działki maks. (skala)</label><input data-k=max inputmode=decimal value="${valV(s.max)}"></div>
  <div><label>Klasa dokładności</label><input data-k=cls inputmode=decimal value="${valV(s.cls)}"></div>
  <div><label>Stała C</label><input data-c readonly></div>
  <div><label>Błąd bezwzgl. Δ (±)</label><input data-d readonly></div>
 </div>
 <table><thead><tr><th>Lp</th><th>α [dz]</th><th>${m.label}</th><th>δ</th></tr></thead><tbody>
 ${s.alfa.map((a,i)=>`<tr><td>${i+1}</td><td><input data-i=${i} inputmode=decimal placeholder="dz" value="${escA(a)}"></td><td class=out></td><td class="out rel"></td></tr>`).join("")}
 </tbody></table>
 <div class=avg><span>średnia:</span><span data-avg></span></div>
 <div class=sub data-avgrel></div>
 <button type=button>Wyczyść pomiary</button>`;
 app.appendChild(card);cards[m.id]=card;
 const outs=[...card.querySelectorAll("td.out:not(.rel)")], rels=[...card.querySelectorAll("td.rel")], ins=[...card.querySelectorAll("[data-i]")];
 function calc(){
  const r=num(s.range), mx=num(s.max), un=s.unit, cu=m.units[0]==="A"?"A":"V";
  card.querySelector("[data-c]").value=(r!==null&&mx)?`${fmt(r/mx)} ${un}/dz`:"–";
  const cl=num(s.cls), d=(cl!==null&&r!==null)?cl*r/100:null;
  card.querySelector("[data-d]").value=d===null?"–":`${fmt(d)} ${un}`;
  const vals=[];
  s.alfa.forEach((a,i)=>{
   const al=num(a);let v=null;
   if(al!==null&&r!==null&&mx){v=al*r/mx;vals.push(v)}
   outs[i].textContent=v===null?"":`${fmt(v)} ${un}`;
   rels[i].textContent=(v!==null&&d!==null&&v!==0)?`${fmt(Math.round(d/Math.abs(v)*1e4)/100)}%`:"";
  });
  const avg=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null;
  card.querySelector("[data-avg]").textContent=avg===null?"–":`${fmt(avg)}${d===null?"":" ± "+fmt(d)} ${un}`;
  card.querySelector("[data-avgrel]").textContent=(avg!==null&&d!==null&&avg!==0)?`δ = ${fmt(Math.round(d/Math.abs(avg)*1e4)/100)}%`:"";
  save();
 }
 card.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.i!==undefined)s.alfa[+t.dataset.i]=t.value;
  else if(t.dataset.k)s[t.dataset.k]=t.value;
  calc();
 });
 card.querySelector("button").onclick=()=>{s.alfa=Array(N).fill("");ins.forEach(i=>i.value="");calc()};
 calc();
});

(function(){
 const BN={2:"dwójkowy (binarny)",8:"ósemkowy",10:"dziesiętny",16:"szesnastkowy"};
 const DIG="0123456789ABCDEF";
 const sec=document.createElement("section");sec.className="card";
 const ns=state.n=state.n||{};ns.val=ns.val||"";ns.from=ns.from||10;ns.to=ns.to||2;
 const opt=(sel)=>Object.keys(BN).map(b=>`<option value=${b}${+b===+sel?" selected":""}>${BN[b]}</option>`).join("");
 sec.innerHTML=`<h2>KALKULATOR SYSTEMÓW</h2>
 <div class="row"><div style="grid-column:1/-1"><label>Liczba</label><input id=nv autocapitalize=characters autocomplete=off autocorrect=off spellcheck=false value="${escA(ns.val)}" placeholder="np. 255"></div>
 <div><label>Z systemu</label><select id=nf>${opt(ns.from)}</select></div>
 <div><label>Na system</label><select id=nt>${opt(ns.to)}</select></div></div>
 <div class=sw><button type=button id=nsw>⇄ Zamień systemy</button></div>
 <div id=nout></div>`;
 app.appendChild(sec);cards.n=sec;
 const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
 const D=c=>DIG.indexOf(c);
 const sup=(b,p)=>`${b}<sup>${p}</sup>`;
 const lines=a=>a.map(l=>`<div class=ln>${l}</div>`).join("");
 const step=(t,a,r)=>`<div class=step><h3>${t}</h3>${lines(a)}${r?`<div class=res>${r}</div>`:""}</div>`;
 function render(){
  const out=document.getElementById("nout"),f=+ns.from,t=+ns.to;
  const raw=ns.val.trim().toUpperCase().replace(/\s+/g,"");
  save();
  if(!raw){out.innerHTML="";return}
  for(const ch of raw){if(D(ch)<0||D(ch)>=f){out.innerHTML=`<div class=err>Znak „${esc(ch)}” nie należy do systemu: ${BN[f]} (cyfry: ${DIG.slice(0,f)}).</div>`;return}}
  const n=BigInt("0x0")+raw.split("").reduce((a,c)=>a*BigInt(f)+BigInt(D(c)),0n);
  const T=x=>x.toString(t).toUpperCase();
  let h="";
  if(f===t){out.innerHTML=step("Ten sam system",["Wybrano ten sam system źródłowy i docelowy, więc liczba się nie zmienia."],esc(raw)+`<sub>${f}</sub>`);return}
  // skrót dla potęg dwójki
  const g={8:3,16:4};
  if(f===2&&g[t]){
   const k=g[t],pad=(k-raw.length%k)%k,bits="0".repeat(pad)+raw,gr=bits.match(new RegExp(`.{${k}}`,"g"));
   h+=step(`Metoda skrótowa: grupujemy po ${k} bity od prawej`,[
    pad?`Dopełniamy zerami z lewej do pełnych grup: ${bits}`:`Liczba ma pełne grupy: ${bits}`,
    `Grupy: ${gr.join(" ")}`,
    ...gr.map(x=>`${x}<sub>2</sub> = ${parseInt(x,2)}<sub>10</sub> = ${parseInt(x,2).toString(16).toUpperCase()}<sub>${t}</sub>`)
   ],`${gr.map(x=>parseInt(x,2).toString(16).toUpperCase()).join("").replace(/^0+(?=.)/,"")}<sub>${t}</sub>`);
  }else if(t===2&&g[f]){
   const k=g[f];
   h+=step(`Metoda skrótowa: każda cyfra to ${k} bity`,raw.split("").map(c=>`${c}<sub>${f}</sub> = ${D(c)}<sub>10</sub> = ${D(c).toString(2).padStart(k,"0")}<sub>2</sub>`),
    `${raw.split("").map(c=>D(c).toString(2).padStart(k,"0")).join("").replace(/^0+(?=.)/,"")}<sub>2</sub>`);
  }
  const gen=h?"Metoda ogólna: ":"";
  let st=1;
  if(f!==10){
   const L=raw.length,ls=[];
   raw.split("").forEach((c,i)=>{
    const p=L-1-i,w=BigInt(f)**BigInt(p),d=BigInt(D(c));
    ls.push(`${c}${D(c)>9?` (=${D(c)})`:""} × ${sup(f,p)} = ${D(c)} × ${w} = ${d*w}`);
   });
   ls.push(`Suma: ${raw.split("").map((c,i)=>BigInt(D(c))*BigInt(f)**BigInt(L-1-i)).join(" + ")} = ${n}`);
   h+=step(`${gen}Krok ${st++}: zamiana z systemu ${f} na dziesiętny (wartość × waga pozycji)`,ls,`${n}<sub>10</sub>`);
  }
  if(t!==10){
   const ls=[];let q=n;
   if(q===0n)ls.push("0 → 0");
   while(q>0n){const r=q%BigInt(t),nq=q/BigInt(t);ls.push(`${q} : ${t} = ${nq}, reszta ${r}${r>9n?` (= ${DIG[Number(r)]})`:""}`);q=nq}
   ls.push("Reszty czytamy od dołu do góry.");
   h+=step(`${gen}Krok ${st++}: zamiana z dziesiętnego na system ${t} (dzielenie przez ${t})`,ls,`${T(n)}<sub>${t}</sub>`);
  }
  h+=`<div class=step><h3>Wynik we wszystkich systemach</h3><div class=all>${[2,8,10,16].map(b=>`<b>${b}</b><span>${n.toString(b).toUpperCase()}</span>`).join("")}</div></div>`;
  out.innerHTML=h;
 }
 document.getElementById("nv").oninput=e=>{ns.val=e.target.value;render()};
 document.getElementById("nf").onchange=e=>{ns.from=+e.target.value;render()};
 document.getElementById("nt").onchange=e=>{ns.to=+e.target.value;render()};
 document.getElementById("nsw").onclick=()=>{
  const raw=ns.val.trim().toUpperCase().replace(/\s+/g,"");let ok=!!raw;
  for(const c of raw)if(D(c)<0||D(c)>=+ns.from)ok=false;
  if(ok){const n=raw.split("").reduce((a,c)=>a*BigInt(ns.from)+BigInt(D(c)),0n);ns.val=n.toString(+ns.to).toUpperCase()}
  [ns.from,ns.to]=[ns.to,ns.from];
  document.getElementById("nv").value=ns.val;document.getElementById("nf").value=ns.from;document.getElementById("nt").value=ns.to;render();
 };
 render();
})();
/* ---------- II PRAWO KIRCHHOFFA (napięciowe) ---------- */
(function(){
 const sec=document.createElement("section");sec.className="card";
 const st=state.k=state.k||{};
 const NEWROW=kind=>({kind:kind||"E",sign:1,unk:"",e:"",i:"",r:""});
 const RESET=()=>{st.rows=[NEWROW("E"),NEWROW("U")]};
 if(!Array.isArray(st.rows)||!st.rows.length)RESET();
 st.rows=st.rows.filter(r=>r&&typeof r==="object").map(r=>({kind:r.kind,sign:r.sign,unk:r.unk,e:r.e,i:r.i,r:r.r}));
 if(!st.rows.length)RESET();
 st.rows.forEach(r=>{
  r.kind=r.kind==="U"?"U":"E";
  r.sign=r.sign===-1?-1:1;
  ["e","i","r"].forEach(k=>{r[k]=r[k]==null?"":String(r[k])});
  if(!(r.kind==="E"?"e":"ir").includes(r.unk))r.unk="";
 });
 sec.innerHTML=`<h2>II PRAWO KIRCHHOFFA</h2>
 <p class="c">W dowolnym oczku obwodu suma algebraiczna sił elektromotorycznych równa się sumie spadków napięć: <b>∑E = ∑I·R</b>. Podawaj wartości w jednostkach podstawowych: V, A, Ω.</p>
 <details class="kn"><summary>Jak ustalić znaki i co można obliczyć?</summary>
  <p>Obiegamy oczko w wybranym kierunku (np. zgodnie z ruchem wskazówek zegara) i porównujemy go z kierunkiem prądu i SEM:</p>
  <ul>
   <li><b>SEM E</b> — znak „+”, gdy przechodzimy przez źródło od bieguna „−” do „+”, czyli SEM działa zgodnie z obiegiem; znak „−” w przeciwnym wypadku.</li>
   <li><b>Spadek I·R</b> — znak „+”, gdy prąd płynie zgodnie z kierunkiem obiegu; znak „−”, gdy płynie przeciwnie.</li>
  </ul>
  <p>Przy wielkości, którą chcesz obliczyć, wybierz <b>szukane</b> i zostaw jej pole puste — program rozwiąże równanie. Wiersze bez żadnych danych są pomijane.</p>
 </details>
 <div id="klist"></div>
 <div class="kbtns">
  <button type="button" id="kaddE">+ SEM (E)</button>
  <button type="button" id="kaddU">+ Spadek (I·R)</button>
  <button type="button" id="kclr">Wyczyść</button>
 </div>
 <div id="kout"></div>`;
 app.appendChild(sec);cards.k=sec;
 const list=sec.querySelector("#klist"), kout=sec.querySelector("#kout");
 const KOPT=[["E","SEM E"],["U","Spadek I·R"]];
 const SOPT=[[1,"+"],[-1,"−"]];
 const UOPT=[["","dane"],["e","szukane E"]], VOPT=[["","dane"],["i","szukane I"],["r","szukane R"]];
 const opts=(a,v)=>a.map(([x,t])=>`<option value="${x}"${String(v)===String(x)?" selected":""}>${t}</option>`).join("");
 function build(){
  list.innerHTML="";
  st.rows.forEach((row,idx)=>{
   const el=document.createElement("div");el.className="el";
   el.innerHTML=`<div class="ehead">
    <select data-f="kind" aria-label="Rodzaj elementu">${opts(KOPT,row.kind)}</select>
    <select data-f="sign" aria-label="Znak w równaniu">${opts(SOPT,row.sign)}</select>
    <select data-f="unk" aria-label="Szukana wielkość">${opts(row.kind==="E"?UOPT:VOPT,row.unk)}</select>
    <button type="button" class="del" data-f="del" aria-label="Usuń element">✕</button>
   </div>
   <div class="ebody" data-b="E"${row.kind==="E"?"":" hidden"}>
    <div><label>E [V]</label><input data-f="e" inputmode="decimal" placeholder="V" value="${escA(row.e)}"></div>
   </div>
   <div class="ebody" data-b="U"${row.kind==="U"?"":" hidden"}>
    <div><label>I [A]</label><input data-f="i" inputmode="decimal" placeholder="A" value="${escA(row.i)}"></div>
    <div><label>R [Ω]</label><input data-f="r" inputmode="decimal" placeholder="Ω" value="${escA(row.r)}"></div>
    <div><label>U = I·R [V]</label><div class="kv" data-f="uv">–</div></div>
   </div>`;
   el.addEventListener("input",e=>{
    const f=e.target.dataset.f;
    if(f==="e"||f==="i"||f==="r"){row[f]=e.target.value;calc()}
   });
   el.querySelector('[data-f="kind"]').onchange=e=>{row.kind=e.target.value;row.unk="";build()};
   el.querySelector('[data-f="sign"]').onchange=e=>{row.sign=e.target.value==="-1"?-1:1;calc()};
   el.querySelector('[data-f="unk"]').onchange=e=>{row.unk=e.target.value;if(row.unk)row[row.unk]="";build()};
   el.querySelector('[data-f="del"]').onclick=()=>{st.rows.splice(idx,1);if(!st.rows.length)RESET();build()};
   list.appendChild(el);
  });
  calc();
 }
 const L=a=>a.map(x=>`<div class="ln">${x}</div>`).join("");
 const STP=(t,a,r)=>`<div class="step"><h3>${t}</h3>${L(a)}${r?`<div class="res">${r}</div>`:""}</div>`;
 const SUB=n=>`<sub>${n}</sub>`;
 const par=v=>v<0?`(${fv(v)})`:fv(v);
 const side=(arr,disp)=>arr.map((t,i)=>{const d=disp?disp[i]:t.lbl;return i?(t.sg<0?" − ":" + ")+d:(t.sg<0?"−":"")+d}).join("");
 const tol=(a,b)=>1e-9*Math.max(1,Math.abs(a),Math.abs(b));
 function calc(){
  save();
  // podgląd U = I·R w każdym wierszu
  st.rows.forEach((row,idx)=>{
   if(row.kind!=="U")return;
   const node=list.children[idx]&&list.children[idx].querySelector('[data-f="uv"]');
   if(!node)return;
   const i=num(row.i),r=num(row.r);
   node.textContent=(i!==null&&r!==null)?`${fv(i*r)} V`:"–";
  });
  const bad=[],warn=[];let sumE=0,sumU=0,uE=null,uU=null,nE=0,nU=0,nUnk=0;const tE=[],tU=[];
  st.rows.forEach((row,idx)=>{
   const sg=row.sign===-1?-1:1;
   if(row.kind==="E"){
    const raw=row.e.trim(),lbl=n=>"E"+SUB(n);
    if(row.unk==="e"){
     if(raw)warn.push(`Wiersz ${idx+1}: E oznaczono jako szukane, więc wpisana wartość „${escA(raw)}” jest pomijana.`);
     nE++;nUnk++;uE={sg,lbl:lbl(nE)};tE.push({sg,lbl:lbl(nE),val:null});return;
    }
    if(raw==="")return;
    const v=num(raw);
    if(v===null){bad.push(`Wiersz ${idx+1}: „${escA(raw)}” nie jest poprawną liczbą (SEM E).`);return}
    nE++;sumE+=sg*v;tE.push({sg,lbl:lbl(nE),val:v});
   }else{
    const ri=row.i.trim(),rr=row.r.trim();let unk=row.unk;
    if(!unk){if(ri===""&&rr==="")return;if(ri==="")unk="i";else if(rr==="")unk="r"}
    const otherSym=unk==="i"?"R":"I",ownSym=unk==="i"?"I":"R";
    const otherRaw=unk==="i"?rr:ri,ownRaw=unk==="i"?ri:rr;
    if(row.unk&&ownRaw)warn.push(`Wiersz ${idx+1}: ${ownSym} oznaczono jako szukane, więc wpisana wartość „${escA(ownRaw)}” jest pomijana.`);
    nU++;const n=nU,lbl=`I${SUB(n)}·R${SUB(n)}`;
    if(otherRaw===""){bad.push(`Wiersz ${idx+1}: aby obliczyć ${ownSym}, podaj ${otherSym}.`);return}
    const other=num(otherRaw);
    if(other===null){bad.push(`Wiersz ${idx+1}: „${escA(otherRaw)}” nie jest poprawną liczbą (${otherSym}).`);return}
    if(other===0){bad.push(`Wiersz ${idx+1}: ${otherSym} = 0, więc nie można wyznaczyć ${ownSym} (dzielenie przez zero).`);return}
    if(unk){nUnk++;uU={sg,lbl,n,which:unk,other,ownSym,otherSym};tU.push({sg,lbl,val:null,unk,other,ownSym,otherSym,n});return}
    const i=num(ri),r=num(rr);
    if(i===null||r===null)return;
    sumU+=sg*i*r;tU.push({sg,lbl,val:i*r,i,r});
   }
  });
  let h=bad.map(b=>`<div class="err">${b}</div>`).join("")+warn.map(w=>`<div class="warn">${w}</div>`).join("");
  if(bad.length){kout.innerHTML=h;return}
  if(!tE.length&&!tU.length){kout.innerHTML=h+`<div class="c" style="margin-top:14px">Uzupełnij dane elementów oczka, aby zobaczyć równanie i wynik.</div>`;return}
  let sn=0;const K=()=>`Krok ${++sn}: `;
  const dE=tE.map(t=>t.val===null?t.lbl:fv(t.val)),dU=tU.map(t=>t.val===null?t.lbl:fv(t.val));
  h+=STP(K()+"Zapisujemy II prawo Kirchhoffa dla oczka",[
   "∑E = ∑I·R",
   `${side(tE)||"0"} = ${side(tU)||"0"}`,
   `${side(tE,dE)||"0"} = ${side(tU,dU)||"0"}`
  ]);
  h+=STP(K()+"Sumujemy siły elektromotoryczne",[
   ...tE.map(t=>t.val===null?`${t.lbl} = ?`:`${t.sg<0?"−":""}${t.lbl} = ${fv(t.sg*t.val)} V`),
   `∑E${uE?" (znane)":""} = ${fv(sumE)} V`
  ],`∑E = ${fv(sumE)} V`);
  h+=STP(K()+"Sumujemy spadki napięć I·R",[
   ...tU.map(t=>t.val===null?`${t.lbl} = ?`:`${t.sg<0?"−":""}${t.lbl} = ${t.sg<0?"−":""}(${fv(t.i)} · ${fv(t.r)}) = ${fv(t.sg*t.val)} V`),
   `∑I·R${uU?" (znane)":""} = ${fv(sumU)} V`
  ],`∑I·R = ${fv(sumU)} V`);
  if(nUnk===0){
   const diff=sumE-sumU,ok=Math.abs(diff)<=tol(sumE,sumU);
   h+=STP(K()+"Sprawdzamy bilans oczka",[
    `∑E − ∑I·R = ${fv(sumE)} − ${fv(sumU)} = ${fv(diff)} V`,
    ok?"Obie strony są równe, więc równanie oczka jest spełnione."
      :"Obie strony nie są równe. Sprawdź znaki (zgodność z kierunkiem obiegu) oraz wartości elementów."
   ],ok?`∑E = ∑I·R ✓ równanie spełnione`:`∑E ≠ ∑I·R — różnica ${fv(diff)} V`);
  }else if(nUnk>1){
   h+=`<div class="err">Zaznacz tylko jedną szukaną wielkość (albo uzupełnij dane), aby obliczyć wynik.</div>`;
  }else if(uE){
   const sg=uE.sg<0?"−1":"+1",rhs=sumU-sumE,val=rhs/uE.sg;
   h+=STP(K()+`Rozwiązujemy równanie — szukane ${uE.lbl}`,[
    `∑E(pozostałe) + (${sg})·${uE.lbl} = ∑I·R`,
    `(${sg})·${uE.lbl} = ${fv(sumU)} − ${par(sumE)}`,
    `(${sg})·${uE.lbl} = ${fv(rhs)}`,
    `${uE.lbl} = ${fv(rhs)} ÷ (${sg}) = ${fv(val)}`
   ],`${uE.lbl} = ${fv(val)} V`)
   +STP(K()+"Sprawdzamy otrzymany wynik",[
    `∑E = ${fv(sumE+uE.sg*val)} V`,
    `∑I·R = ${fv(sumU)} V`
   ],`∑E = ∑I·R ✓`)
   +(val<0?`<div class="warn">Wynik ujemny — przy przyjętym kierunku obiegu SEM ma zwrot przeciwny do założonego.</div>`:"");
  }else{
   const sg=uU.sg<0?"−1":"+1",rhs=sumE-sumU,prod=uU.sg*uU.other,val=rhs/prod;
   const own=`${uU.ownSym}${SUB(uU.n)}`,unit=uU.which==="i"?"A":"Ω";
   const term=uU.which==="i"?`${own}·${fv(uU.other)}`:`${fv(uU.other)}·${own}`;
   h+=STP(K()+`Rozwiązujemy równanie — szukane ${own}`,[
    `∑E = ∑I·R(pozostałe) + (${sg})·${uU.lbl}`,
    `(${sg})·${uU.lbl} = ${fv(sumE)} − ${par(sumU)}`,
    `(${sg})·${term} = ${fv(rhs)}`,
    `${own} = ${fv(rhs)} ÷ ((${sg}) · ${fv(uU.other)}) = ${fv(val)}`
   ],`${own} = ${fv(val)} ${unit}`)
   +STP(K()+"Sprawdzamy otrzymany wynik",[
    `∑E = ${fv(sumE)} V`,
    `∑I·R = ${fv(sumU+prod*val)} V`
   ],`∑E = ∑I·R ✓`)
   +(val<0?`<div class="warn">Wynik ujemny — przy przyjętym kierunku obiegu prąd (lub spadek napięcia) ma zwrot przeciwny do założonego.</div>`:"");
  }
  kout.innerHTML=h;
 }
 sec.querySelector("#kaddE").onclick=()=>{st.rows.push(NEWROW("E"));build()};
 sec.querySelector("#kaddU").onclick=()=>{st.rows.push(NEWROW("U"));build()};
 sec.querySelector("#kclr").onclick=()=>{RESET();build()};
 build();
})();
/* ---------- UKŁAD RÓWNAŃ (metoda Cramera) ---------- */
(function(){
 const sec=document.createElement("section");sec.className="card";
 const st=state.r=state.r||{};
 const DEFN=["x","y","z"];
 st.n=st.n===3?3:2;
 if(!Array.isArray(st.names)||st.names.length!==3)st.names=DEFN.slice();
 st.names=st.names.map((v,i)=>v==null?DEFN[i]:String(v));
 const oldC=Array.isArray(st.c)?st.c:[];
 st.c=[0,1,2].map(i=>{const src=Array.isArray(oldC[i])?oldC[i]:[];return [0,1,2,3].map(j=>src[j]==null?"":String(src[j]))});
 sec.innerHTML=`<h2>UKŁAD RÓWNAŃ</h2>
 <p class="c">Rozwiązywanie układu 2 lub 3 równań liniowych <b>metodą Cramera</b> (wyznaczniki) — krok po kroku. Niewiadome możesz nazwać, np. <b>I1</b>, <b>I2</b>, <b>I3</b>.</p>
 <div class="row"><div style="grid-column:1/-1"><label>Liczba równań i niewiadomych</label><select id="rn"><option value="2">2 równania</option><option value="3">3 równania</option></select></div></div>
 <div id="rmx"></div>
 <div class="kbtns"><button type="button" id="rclr">Wyczyść</button></div>
 <div id="rout"></div>`;
 app.appendChild(sec);cards.r=sec;
 const mx=sec.querySelector("#rmx"),rout=sec.querySelector("#rout"),sel=sec.querySelector("#rn");
 const L=a=>a.map(x=>typeof x==="string"?`<div class="ln">${x}</div>`:`<div class="ln pre">${x.pre}</div>`).join("");
 const STP=(t,a,r)=>`<div class="step"><h3>${t}</h3>${L(a)}${r?`<div class="res">${r}</div>`:""}</div>`;
 const nm=()=>{const o=[];for(let j=0;j<st.n;j++)o.push((st.names[j]||"").trim()||DEFN[j]);return o};
 const series=it=>{let s="";it.forEach((x,i)=>{s+=i===0?(x.neg?"−"+x.body:x.body):(x.neg?" − "+x.body:" + "+x.body)});return s===""?"0":s};
 function build(){
  const n=st.n;
  let h=`<div class="mx" style="grid-template-columns:auto repeat(${n},minmax(0,1fr)) auto minmax(0,1fr)">`;
  h+=`<div></div>`;
  for(let j=0;j<n;j++)h+=`<input class="nm" data-nm="${j}" value="${escA(st.names[j])}" aria-label="nazwa niewiadomej ${j+1}">`;
  h+=`<div class="me">=</div><div></div>`;
  for(let i=0;i<n;i++){
   h+=`<div class="ml">R${i+1}</div>`;
   for(let j=0;j<n;j++)h+=`<input data-c="${i},${j}" inputmode="decimal" aria-label="współczynnik w równaniu ${i+1}" value="${escA(st.c[i][j])}">`;
   h+=`<div class="me">=</div><input class="rhs" data-c="${i},3" inputmode="decimal" aria-label="prawa strona równania ${i+1}" value="${escA(st.c[i][3])}">`;
  }
  mx.innerHTML=h+`</div>`;
  calc();
 }
 mx.addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.nm!==undefined)st.names[+d.nm]=e.target.value;
  else if(d.c){const p=d.c.split(",");st.c[+p[0]][+p[1]]=e.target.value}
  else return;
  calc();
 });
 sel.onchange=()=>{st.n=+sel.value;build()};
 sec.querySelector("#rclr").onclick=()=>{st.c=[0,1,2].map(()=>["","","",""]);build()};
 function calc(){
  save();
  const n=st.n,nazwy=nm(),bad=[],A=[],B=[];let any=false;
  for(let i=0;i<n;i++){
   const row=[];
   for(let j=0;j<n;j++){
    const raw=(st.c[i][j]||"").trim();
    if(raw)any=true;
    if(raw===""){row.push(0);continue}
    const v=num(raw);
    if(v===null){bad.push(`Równanie ${i+1}: „${escA(raw)}” nie jest poprawną liczbą (kolumna ${escA(nazwy[j])}).`);row.push(0)}
    else row.push(v);
   }
   const rb=(st.c[i][3]||"").trim();let b=0;
   if(rb){any=true;const v=num(rb);if(v===null)bad.push(`Równanie ${i+1}: „${escA(rb)}” nie jest poprawną liczbą (prawa strona).`);else b=v}
   A.push(row);B.push(b);
  }
  let h=bad.map(x=>`<div class="err">${x}</div>`).join("");
  if(bad.length){rout.innerHTML=h;return}
  if(!any){rout.innerHTML=h+`<div class="c" style="margin-top:12px">Wpisz współczynniki przy niewiadomych i prawe strony równań.</div>`;return}
  const eq=i=>{
   let s="";
   for(let j=0;j<n;j++){
    const v=A[i][j];if(v===0)continue;
    const a=Math.abs(v),t=(a===1?"":fv(a))+escA(nazwy[j]);
    s+=s===""?(v<0?"−":"")+t:(v<0?" − ":" + ")+t;
   }
   return (s===""?"0":s)+" = "+fv(B[i]);
  };
  const d2=m=>m[0][0]*m[1][1]-m[0][1]*m[1][0];
  const d3=m=>m[0][0]*m[1][1]*m[2][2]+m[0][1]*m[1][2]*m[2][0]+m[0][2]*m[1][0]*m[2][1]
              -m[0][2]*m[1][1]*m[2][0]-m[0][0]*m[1][2]*m[2][1]-m[0][1]*m[1][0]*m[2][2];
  const terms=m=>n===2
   ?[[1,[m[0][0],m[1][1]]],[-1,[m[0][1],m[1][0]]]]
   :[[1,[m[0][0],m[1][1],m[2][2]]],[1,[m[0][1],m[1][2],m[2][0]]],[1,[m[0][2],m[1][0],m[2][1]]],
     [-1,[m[0][2],m[1][1],m[2][0]]],[-1,[m[0][0],m[1][2],m[2][1]]],[-1,[m[0][1],m[1][0],m[2][2]]]];
  const matLines=(m,label)=>{
   const w=[];
   for(let j=0;j<n;j++)w.push(Math.max.apply(null,m.map(r=>fv(r[j]).length)));
   return m.map((r,i)=>(i===0?label+" = ":" ".repeat(label.length+3))+"| "+r.map((v,j)=>fv(v).padStart(w[j])).join("  ")+" |");
  };
  const detLines=(m,label)=>{
   const ts=terms(m),prods=ts.map(t=>t[0]*t[1].reduce((a,b)=>a*b,1));
   const sum=prods.reduce((a,b)=>a+b,0);
   const f1=series(ts.map(t=>({neg:t[0]<0,body:t[1].map(v=>v<0?"("+fv(v)+")":fv(v)).join("·")})));
   const f2=series(prods.map(p=>({neg:p<0,body:fv(Math.abs(p))})));
   return {lines:[{pre:matLines(m,label).join("\n")},`${label} = ${f1}`,`${label} = ${f2}`,`${label} = ${fv(sum)}`],value:sum};
  };
  let sn=0;const K=()=>`Krok ${++sn}: `;
  h+=STP(K()+"Zapisujemy układ równań",Array.from({length:n},(_,i)=>eq(i)));
  const W=detLines(A,"W");
  h+=STP(K()+"Liczymy wyznacznik główny W",W.lines,`W = ${fv(W.value)}`);
  let scale=1;
  A.forEach(r=>r.forEach(v=>{if(Math.abs(v)>scale)scale=Math.abs(v)}));
  if(Math.abs(W.value)<=1e-10*Math.max(1,Math.pow(scale,n))){
   h+=`<div class="err">Wyznacznik główny W = 0, więc układ nie ma jednoznacznego rozwiązania — jest nieoznaczony albo sprzeczny. Metoda Cramera nie daje wtedy wyniku; sprawdź równania.</div>`;
   rout.innerHTML=h;return;
  }
  const Wk=[],xs=[],lines=[];
  for(let k=0;k<n;k++){
   const M=A.map((row,i)=>row.map((v,j)=>j===k?B[i]:v));
   const d=detLines(M,"W"+escA(nazwy[k]));
   Wk.push(d.value);xs.push(d.value/W.value);lines.push(...d.lines);
  }
  h+=STP(K()+"Liczymy wyznaczniki dla każdej niewiadomej",[
   "W każdym z nich kolumnę danej niewiadomej zastępujemy prawymi stronami równań.",
   ...lines
  ]);
  h+=STP(K()+"Dzielimy wyznaczniki — otrzymujemy rozwiązanie",
   xs.map((x,k)=>`${escA(nazwy[k])} = W${escA(nazwy[k])} ÷ W = ${fv(Wk[k])} ÷ ${fv(W.value)} = ${fv(x)}`),
   xs.map((x,k)=>`${escA(nazwy[k])} = ${fv(x)}`).join("<br>"));
  const chk=[];let ok=true;
  for(let i=0;i<n;i++){
   const it=[];let left=0;
   for(let j=0;j<n;j++){
    const a=A[i][j];if(a===0)continue;
    left+=a*xs[j];
    it.push({neg:(a<0)!==(xs[j]<0),body:`${fv(Math.abs(a))}·${xs[j]<0?"("+fv(xs[j])+")":fv(xs[j])}`});
   }
   const good=Math.abs(left-B[i])<=1e-9*Math.max(1,Math.abs(B[i]));
   if(!good)ok=false;
   chk.push(`R${i+1}: ${series(it)} = ${fv(left)}   (prawa: ${fv(B[i])}) ${good?"✓":"✗"}`);
  }
  h+=STP(K()+"Sprawdzamy rozwiązanie, podstawiając je do równań",chk,
   ok?"Rozwiązanie spełnia wszystkie równania ✓":"Uwaga: któreś równanie nie zgadza się — sprawdź dane.");
  rout.innerHTML=h;
 }
 sel.value=String(st.n);
 build();
})();
